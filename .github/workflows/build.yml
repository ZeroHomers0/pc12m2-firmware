name: Build and verify firmware

on:
  workflow_dispatch:
  push:
    branches: [main, firmware-menu-display-2026-11-13]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'
      - name: Install Python deps
        run: pip install unicorn==2.1.4 capstone==5.0.7 PyYAML==6.0.3
      - name: Build
        run: bash firmware/build.sh
      - name: Run attested software gates
        run: python tools/verification/run_software_gates.py --extended
      - name: Compute firmware SHA-256
        run: sha256sum firmware/firmware.bin | awk '{print $1}' > firmware/firmware.bin.sha256
      - name: Package flash tool zip
        run: python tools/flash/package_flash_tool.py --name flash-tool-pc12m2
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-pc12m2
          path: |
            firmware/firmware.bin
            firmware/firmware.bin.sha256
            firmware/firmware.hex
            firmware/firmware.elf
            firmware/firmware.map
            release/flash-tool-pc12m2.zip
          if-no-files-found: error
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: software-evidence-pc12m2
          path: tmp/software_gates/
          if-no-files-found: error

  # 只有本仓main推送且所有门禁成功才保留原有滚动发布功能。
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ZeroHomers0/pc12m2-firmware'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-pc12m2
          path: .
      - name: Publish firmware to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="latest"
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$TAG" \
            firmware/firmware.bin firmware/firmware.bin.sha256 \
            release/flash-tool-pc12m2.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Latest firmware build" \
            --notes "自动构建 PC12M-2，完整软件门禁通过。SHA-256: $(cat firmware/firmware.bin.sha256)" \
            --latest
