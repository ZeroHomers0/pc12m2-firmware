name: Build firmware

on:
  # 手动触发
  workflow_dispatch:
  # push 到 main 自动触发
  push:
    branches: [main]
  # 任意 PR 自动触发（可在仓库 Settings → Actions 里关掉）
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # 发布固件到 GitHub Release 需要写权限
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 Arm GNU Toolchain（arm-none-eabi-gcc）14.2 版本，
      # 与 firmware/build.sh 约定的“14.2 rel1”一致。
      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      # 测试依赖（Unicorn 执行级测试需要）
      - name: Install Python deps
        run: pip install unicorn

      # 构建固件：产物 firmware.elf / firmware.hex / firmware.bin / firmware.map
      # 必须先构建——Unicorn 测试加载 firmware.elf、verify 模块 import 时读 firmware.bin。
      - name: Build
        run: bash firmware/build.sh

      # 静态 + Unicorn 执行级测试（AGENTS.md：修改源码后必须以原始 BIN 做 A/B 验证）
      - name: Run tests
        run: python test/run_tests.py

      # 归档构建产物（Actions 页面可直接下载）
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-pc12m2
          path: |
            firmware/firmware.bin
            firmware/firmware.hex
            firmware/firmware.elf
            firmware/firmware.map
          if-no-files-found: error

      # 生成固件哈希（供下载侧校验，见 tools/flash/flash_release.sh）
      - name: Compute firmware SHA-256
        run: sha256sum firmware/firmware.bin | awk '{print $1}' > firmware/firmware.bin.sha256

      # 发布到 GitHub Release（滚动 latest tag）——仅 push 到 main 时，PR 不发布。
      # 其他电脑可免环境直接用 tools/flash/flash_release.sh 拉取本固件烧写。
      - name: Publish firmware to Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="latest"
          # 删除旧的 latest release（若存在）后重建，保证指向最新构建
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            firmware/firmware.bin firmware/firmware.bin.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest firmware build" \
            --notes "自动构建固件 PC12M-2。SHA-256: $(cat firmware/firmware.bin.sha256)" \
            --latest
          echo "已发布 Release: $GITHUB_REPOSITORY/releases/tag/$TAG"
