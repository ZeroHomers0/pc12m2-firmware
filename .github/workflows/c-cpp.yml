name: Build firmware

on:
  # 手动触发
  workflow_dispatch:
  # push 到 main 自动触发
  push:
    branches: [main]
  # 任意 PR 自动触发（可在仓库 Settings → Actions 里关掉）
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 Arm GNU Toolchain（arm-none-eabi-gcc）14.2 版本，
      # 与 firmware/build.sh 约定的“14.2 rel1”一致。
      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      # 测试依赖（Unicorn 执行级测试需要）
      - name: Install Python deps
        run: pip install unicorn

      # 先跑静态 + Unicorn 执行级测试（AGENTS.md 要求修改源码后必须 A/B 验证）
      - name: Run tests
        run: python test/run_tests.py

      # 构建固件：产物 firmware.elf / firmware.hex / firmware.bin / firmware.map
      - name: Build
        run: bash firmware/build.sh

      # 归档构建产物（Actions 页面可直接下载）
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-pc6m10
          path: |
            firmware/firmware.bin
            firmware/firmware.hex
            firmware/firmware.elf
            firmware/firmware.map
          if-no-files-found: error
